<!DOCTYPE html>
<html>
<body>

<script>

let color = ["Blue","Green","Red","Orange","Violet","Indigo","Yellow"];
let o = ["th","st","nd","rd"];

for(let i=0;i<color.length;i++){

    let suffix;

    if(i==0)
        suffix=o[1];
    else if(i==1)
        suffix=o[2];
    else if(i==2)
        suffix=o[3];
    else
        suffix=o[0];

    document.write((i+1)+suffix+" choice is "+color[i]+"<br>");
}

</script>

</body>
</html>
