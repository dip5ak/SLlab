<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2db0d6;
        }

        .clock {
            width: 220px;
            height: 220px;
            background-color: white;
            border: 8px solid black;
            border-radius: 50%;
            position: relative;
        }

        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }

        .number span {
            position: absolute;
            left: 50%;
            top: 5px;
            transform-origin: 0 105px;
        }

        .n1 { transform: rotate(30deg); }
        .n2 { transform: rotate(60deg); }
        .n3 { transform: rotate(90deg); }
        .n4 { transform: rotate(120deg); }
        .n5 { transform: rotate(150deg); }
        .n6 { transform: rotate(180deg); }
        .n7 { transform: rotate(210deg); }
        .n8 { transform: rotate(240deg); }
        .n9 { transform: rotate(270deg); }
        .n10 { transform: rotate(300deg); }
        .n11 { transform: rotate(330deg); }
        .n12 { transform: rotate(0deg); }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 5px;
        }

        .hour {
            width: 6px;
            height: 65px;
            background-color: black;
        }

        .minute {
            width: 5px;
            height: 85px;
            background-color: black;
        }

        .second {
            width: 2px;
            height: 90px;
            background-color: red;
        }

        .center {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: black;
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>

    <div class="clock">

        <div class="number">
            <span class="n12">12</span>
            <span class="n1">1</span>
            <span class="n2">2</span>
            <span class="n3">3</span>
            <span class="n4">4</span>
            <span class="n5">5</span>
            <span class="n6">6</span>
            <span class="n7">7</span>
            <span class="n8">8</span>
            <span class="n9">9</span>
            <span class="n10">10</span>
            <span class="n11">11</span>
        </div>

        <div class="hand hour" id="hour"></div>
        <div class="hand minute" id="minute"></div>
        <div class="hand second" id="second"></div>

        <div class="center"></div>

    </div>

    <script>
        function updateClock() {

            const now = new Date();

            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            // Calculate angles
            const hourAngle =
                (hours % 12) * 30 +
                minutes * 0.5;

            const minuteAngle =
                minutes * 6 +
                seconds * 0.1;

            const secondAngle =
                seconds * 6;

            // Rotate hands
            document.getElementById("hour").style.transform =
                `rotate(${hourAngle}deg)`;

            document.getElementById("minute").style.transform =
                `rotate(${minuteAngle}deg)`;

            document.getElementById("second").style.transform =
                `rotate(${secondAngle}deg)`;
        }

        updateClock();

        setInterval(updateClock, 1000);
    </script>

</body>
</html>
