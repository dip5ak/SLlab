<!DOCTYPE html>
<html>
<head>
<title>Username Availability</title>
<style>#result{margin-top:10px;font-weight:bold}</style>
</head>
<body>
<h2>Password Reset</h2>
<label>Username:</label>
<input type="text" id="username" onkeyup="checkUsername()">
<div id="result"></div>

<script>
function checkUsername(){
    const username = document.getElementById("username").value.trim();
    const result = document.getElementById("result");

    if(username === ""){
        result.textContent = "";
        return;
    }

    const xhr = new XMLHttpRequest();
    xhr.onreadystatechange = function(){
        if(this.readyState === 4 && this.status === 200){
            result.textContent = this.responseText;
        }
    };
    xhr.open("GET", "q13_check_username.php?username=" + encodeURIComponent(username), true);
    xhr.send();
}
</script>
</body>
</html>
