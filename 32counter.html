<!DOCTYPE html>
<html>
<body>

<h1 id="count">0</h1>

<button onclick="increase()">+</button>

<button onclick="decrease()">-</button>

<button onclick="reset()">Reset</button>

<script>

let c=0;

function increase(){
c++;
document.getElementById("count").innerHTML=c;
}

function decrease(){
c--;
document.getElementById("count").innerHTML=c;
}

function reset(){
c=0;
document.getElementById("count").innerHTML=c;
}

</script>

</body>
</html>
