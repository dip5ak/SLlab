<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q37 - Clone / Remove Table Rows</title>
<style>
  table { width: 100%; max-width: 700px; border-collapse: collapse; }
  th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
  .trash-btn { background: #e53935; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
  #addRowBtn { margin-top: 12px; background: #1e88e5; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>

<table id="productTable">
  <thead>
    <tr><th>No</th><th>Product</th><th>Price</th><th>Action</th></tr>
  </thead>
  <tbody id="tableBody">
    <tr>
      <td class="rowNo">1</td>
      <td>
        <select>
          <option value="">Select Product</option>
          <option value="laptop">Laptop</option>
          <option value="phone">Phone</option>
        </select>
      </td>
      <td><input type="text" placeholder="Price"></td>
      <td><button class="trash-btn" onclick="removeRow(this)">Delete</button></td>
    </tr>
  </tbody>
</table>

<button id="addRowBtn" onclick="addRow()">+ Add New</button>

<script>
  const tableBody = document.getElementById('tableBody');

  // a. Clone last row and append as new last row
  function addRow() {
    const lastRow = tableBody.rows[tableBody.rows.length - 1];
    const newRow = lastRow.cloneNode(true);
    newRow.querySelector('select').selectedIndex = 0;
    newRow.querySelector('input[type="text"]').value = '';
    newRow.querySelector('.rowNo').textContent = tableBody.rows.length + 1;
    newRow.querySelector('.trash-btn').setAttribute('onclick', 'removeRow(this)');
    tableBody.appendChild(newRow);
  }

  // b. Remove clicked row from DOM
  function removeRow(btn) {
    btn.closest('tr').remove();
    renumberRows();
  }

  function renumberRows() {
    tableBody.querySelectorAll('tr').forEach((row, i) => {
      row.querySelector('.rowNo').textContent = i + 1;
    });
  }
</script>
</body>
</html>
