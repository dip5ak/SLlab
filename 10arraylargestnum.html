<!DOCTYPE html>
<html>
<body>

<script>

let n = Number(prompt("Enter number of elements"));

let arr = [];

for(let i=0;i<n;i++){
    arr[i] = Number(prompt("Enter element " + (i+1)));
}

let largest = arr[0];

for(let i=1;i<n;i++){
    if(arr[i] > largest){
        largest = arr[i];
    }
}

document.write("Array = " + arr);
document.write("<br>");
document.write("Largest Element = " + largest);

</script>

</body>
</html>
