<!DOCTYPE html>
<html>
<head>
<title>AJAX Login</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
body{font-family:Arial;max-width:400px;margin:40px auto}
input{width:100%;padding:9px;margin:7px 0}
button{padding:9px 15px}
#message{margin-top:15px}
</style>
</head>
<body>
<div id="loginBox">
<h2>Login</h2>
<form id="loginForm">
<input type="text" id="userid" placeholder="User ID" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<div id="message"></div>
</div>

<script>
$("#loginForm").submit(function(e){
    e.preventDefault();

    $.ajax({
        url: "q10_login.php",
        method: "POST",
        data: {
            userid: $("#userid").val(),
            password: $("#password").val()
        },
        success: function(response){
            if(response.trim() === "success"){
                $("#loginBox").html("<h2>Welcome!</h2><p>Login successful.</p>");
            }else{
                $("#message").text("Invalid userid or password. Try again.");
            }
        },
        error: function(){
            $("#message").text("Server error. Check PHP/XAMPP.");
        }
    });
});
</script>
</body>
</html>
