<!DOCTYPE html>
<html>
<body>

<script>

let a = Number(prompt("Enter first number"));
let b = Number(prompt("Enter second number"));

document.write("Addition = " + (a+b));
document.write("<br>");

document.write("Subtraction = " + (a-b));
document.write("<br>");

document.write("Multiplication = " + (a*b));
document.write("<br>");

document.write("Division = " + (a/b));

</script>

</body>
</html>
