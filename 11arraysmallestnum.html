<!DOCTYPE html>
<html>
<body>

<script>

let n = Number(prompt("Enter number of elements:"));
let arr = [];

for(let i = 0; i < n; i++){
    arr[i] = Number(prompt("Enter element " + (i+1)));
}

let smallest = arr[0];

for(let i = 1; i < n; i++){
    if(arr[i] < smallest){
        smallest = arr[i];
    }
}

document.write("Array: " + arr + "<br>");
document.write("Smallest Element: " + smallest);

</script>

</body>
</html>
