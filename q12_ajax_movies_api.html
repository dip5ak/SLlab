<!DOCTYPE html>
<html>
<head>
  <title>Movies API Using AJAX</title>
  <style>
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #999; padding: 8px; text-align: left; }
    img { width: 80px; height: 100px; object-fit: cover; }
  </style>
</head>
<body>
  <h2>Movie List</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th><th>Title</th><th>Poster</th><th>Year</th>
        <th>Genre</th><th>Rating</th><th>Director</th>
        <th>Country</th><th>Language</th><th>Actors</th>
      </tr>
    </thead>
    <tbody id="movies">
      <tr><td colspan="10">Loading movie data...</td></tr>
    </tbody>
  </table>

  <script>
    fetch("https://freetestapi.com/api/v1/movies")
      .then(response => {
        if (!response.ok) throw new Error("Network error");
        return response.json();
      })
      .then(movies => {
        const rows = movies.map(movie => `
          <tr>
            <td>${movie.id ?? ""}</td>
            <td>${movie.title ?? ""}</td>
            <td><img src="${movie.poster ?? ""}" alt="Poster"></td>
            <td>${movie.year ?? ""}</td>
            <td>${movie.genre ?? ""}</td>
            <td>${movie.rating ?? ""}</td>
            <td>${movie.director ?? ""}</td>
            <td>${movie.country ?? ""}</td>
            <td>${movie.language ?? ""}</td>
            <td>${Array.isArray(movie.actors) ? movie.actors.join(", ") : movie.actors ?? ""}</td>
          </tr>
        `).join("");
        document.getElementById("movies").innerHTML = rows;
      })
      .catch(error => {
        document.getElementById("movies").innerHTML =
          "<tr><td colspan='10'>Unable to load movie data.</td></tr>";
        console.error(error);
      });
  </script>
</body>
</html>
