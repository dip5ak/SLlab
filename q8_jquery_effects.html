<!DOCTYPE html>
<html>
<head>
    <title>jQuery Effects</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        #box { width: 200px; padding: 50px 20px; background: lightblue; text-align: center; margin: 20px; }
        button { margin: 4px; padding: 8px 12px; }
    </style>
</head>
<body>
<h2>jQuery Effects</h2>
<div id="box">jQuery Effect Box</div>

<button id="hide">hide</button>
<button id="show">show</button>
<button id="toggle">toggle</button>
<button id="fadeIn">fadeIn</button>
<button id="fadeOut">fadeOut</button>
<button id="fadeToggle">fadeToggle</button>
<button id="slideUp">slideUp</button>
<button id="slideDown">slideDown</button>
<button id="slideToggle">slideToggle</button>
<button id="animate">animate</button>

<script>
$(function() {
    $("#hide").click(() => $("#box").hide());
    $("#show").click(() => $("#box").show());
    $("#toggle").click(() => $("#box").toggle());
    $("#fadeIn").click(() => $("#box").fadeIn());
    $("#fadeOut").click(() => $("#box").fadeOut());
    $("#fadeToggle").click(() => $("#box").fadeToggle());
    $("#slideUp").click(() => $("#box").slideUp());
    $("#slideDown").click(() => $("#box").slideDown());
    $("#slideToggle").click(() => $("#box").slideToggle());
    $("#animate").click(() => $("#box").animate({
        width: "300px",
        height: "100px",
        opacity: 0.6,
        marginLeft: "100px"
    }, 1000));
});
</script>
</body>
</html>
