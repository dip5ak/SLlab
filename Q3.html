<!DOCTYPE html>
<html>
<body>

<script>
function countVowels(str){
    let count = 0;
    let vowels = "aeiouAEIOU";

    for(let i=0;i<str.length;i++){
        if(vowels.includes(str[i])){
            count++;
        }
    }

    return count;
}

let str = prompt("Enter a string:");
document.write("Number of vowels = " + countVowels(str));
</script>

</body>
</html>
